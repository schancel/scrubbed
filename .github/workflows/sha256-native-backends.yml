name: SHA-256 native backends

on:
  workflow_dispatch:
  push:
    branches:
      - issue-185-sha256-backends
    paths:
      - ".github/workflows/sha256-native-backends.yml"
      - "benchmarks/sha256_backend_check.d"
      - "source/**/*.d"
      - "dub.json"
      - "dub.selections.json"
  pull_request:
    paths:
      - ".github/workflows/sha256-native-backends.yml"
      - "benchmarks/sha256_backend_check.d"
      - "source/**/*.d"
      - "dub.json"
      - "dub.selections.json"

permissions:
  contents: read

jobs:
  native:
    name: ${{ matrix.architecture }} native instructions
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x86_64
            runner: ubuntu-24.04
          - architecture: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install pinned LDC
        uses: dlang-community/setup-dlang@2979e3ea011f6a234cd3a47dcbeb60f451c9635f
        with:
          compiler: ldc-1.43.0

      - name: Build release-active backend harness
        run: |
          ldc2 -O3 -release -d-version=Sha256BackendO3Release -Isource \
            benchmarks/sha256_backend_check.d source/crypto/sha256.d \
            source/crypto/sha256_arm64.d source/crypto/sha256_x86_64.d \
            -of=/tmp/scrubbed-sha256-backend-check

      - name: Execute native backend proof
        run: |
          /tmp/scrubbed-sha256-backend-check \
            --native-report "sha256-native-${{ matrix.architecture }}.json"
          /tmp/scrubbed-sha256-backend-check \
            --check-native-report "sha256-native-${{ matrix.architecture }}.json"
          /tmp/scrubbed-sha256-backend-check --long-test

      - name: Validate committed architecture evidence
        run: |
          /tmp/scrubbed-sha256-backend-check --check-native-report \
            "benchmarks/sha256-native-${{ matrix.architecture }}-evidence.json"

      - name: Upload sanitized evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sha256-native-${{ matrix.architecture }}
          path: sha256-native-${{ matrix.architecture }}.json
          if-no-files-found: error
          retention-days: 14

  package:
    name: production package and tests
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install pinned LDC
        uses: dlang-community/setup-dlang@2979e3ea011f6a234cd3a47dcbeb60f451c9635f
        with:
          compiler: ldc-1.43.0

      - name: Test and build production package
        run: |
          dub test --compiler=ldc2
          dub build --compiler=ldc2 --build=release
