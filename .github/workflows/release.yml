name: release

# Issue #499 (slice of #61): tag-triggered release workflow. Fires on `v*`
# tag pushes, builds macOS arm64, Linux x86_64, and Linux aarch64 release
# binaries (Windows out of scope -- no POSIX port contract, matches
# dub.json's own preBuildCommands platform gate), and publishes a GitHub
# Release with .tar.gz archives, Debian packages, the installer, a
# SHA256SUMS manifest, build metadata, signed provenance attestations, the live
# third_party/** license/notice closure (experiments/package_core/check.d),
# and bash/zsh/fish completions. The macOS leg also runs
# experiments/metadata_route/cli_check.d against the built binary --
# route-metadata's path-safety proof (route overlap, manifest alias,
# hardlink rejection; issue #468).
#
# The release is created as a draft first and only un-drafted by the final
# `publish` job once every target has built, packaged, self-verified, and
# uploaded successfully -- a failed build never leaves a half-published
# real release behind.
#
# VERSION is a build-time-only override: this workflow overwrites the
# checked-out VERSION file with the triggering tag (minus its leading `v`)
# immediately before `dub build`, and never commits that change anywhere.
# See source/cli_commands.d's `scrubbedVersion` for the compile-time
# `import("VERSION")` this feeds.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  create-release:
    name: create draft release
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Create draft release for ${{ github.ref_name }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          prerelease_flag=()
          # SemVer pre-release convention: a hyphen suffix (e.g.
          # v0.0.1-test1) is marked as a GitHub pre-release.
          if [[ "$TAG" == *-* ]]; then prerelease_flag=(--prerelease); fi
          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --draft "${prerelease_flag[@]}" \
            --title "$TAG" \
            --notes "scrubbed $TAG from source commit $GITHUB_SHA -- macOS arm64 and Linux x86_64/aarch64 archives, Debian packages, installer, SHA-256 checksums, bundled license notices, shell completions, and signed GitHub artifact attestations. Every asset is built and published by this tag-triggered workflow."

  build:
    name: build ${{ matrix.target }}
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macos-arm64
            runner: macos-15
            linux: false
          - target: linux-x86_64
            runner: ubuntu-24.04
            linux: true
          - target: linux-aarch64
            runner: ubuntu-24.04-arm
            linux: true
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install pinned LDC
        uses: dlang-community/setup-dlang@2979e3ea011f6a234cd3a47dcbeb60f451c9635f
        with:
          compiler: ldc-1.43.0

      - name: Install Linux build dependencies (issue #353)
        if: matrix.linux
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake build-essential
          sudo apt-get install -y --no-install-recommends libcurl4-openssl-dev

      - name: Stamp release VERSION from tag (build-time only, never committed)
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          printf '%s\n' "$version" > VERSION
          echo "version=$version" >> "$GITHUB_ENV"
          echo "Stamped VERSION -> $version"

      - name: Build release binary
        run: dub build --compiler=ldc2 --build=release

      - name: Route-metadata path-safety proof (issue #468)
        # macOS-only: the changed-binary scenario ad-hoc-signs a copy of the
        # executable with /usr/bin/codesign (required for a modified arm64
        # Mach-O to execute at all); no Linux equivalent exists, so this
        # doesn't run on the linux-x86_64/linux-aarch64 legs. See
        # docs/metadata-route.md#proof-shipping-binary.
        if: matrix.target == 'macos-arm64'
        run: |
          ldc2 -i -O3 -release -preview=dip1000 -Isource \
            -of=.dub/metadata-route-cli-check \
            experiments/metadata_route/cli_check.d third_party/sqlite/sqlite3.o
          .dub/metadata-route-cli-check ./scrubbed

      - name: Stage binary at conventional install path for completions
        # `scrubbed completion init` bakes its own resolved thisExePath()
        # into the printed script (source/cli_commands.d's
        # printCompletionSetup); generating completions against
        # /usr/local/bin/scrubbed means the bundled scripts work as-is for
        # anyone who installs the release binary to that same conventional
        # path, and is honestly reproducible (not a build-machine-only
        # throwaway path).
        run: sudo install -m 0755 ./scrubbed /usr/local/bin/scrubbed

      - name: Build package checker
        run: ldc2 -O3 -release experiments/package_core/check.d -of=/tmp/scrubbed-check

      - name: Assemble and self-verify release package
        run: |
          rm -rf /tmp/scrubbed-package
          /tmp/scrubbed-check create "$PWD" "$PWD/scrubbed" /tmp/scrubbed-package /usr/local/bin/scrubbed
          /tmp/scrubbed-check verify "$PWD" /tmp/scrubbed-package "$version"

      - name: Archive package
        run: |
          archive="scrubbed-${version}-${{ matrix.target }}.tar.gz"
          tar -C /tmp/scrubbed-package -czf "$archive" .
          echo "archive=$archive" >> "$GITHUB_ENV"
          ls -la "$archive"
          sha256sum "$archive"

      - name: Upload archive to draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release upload "$TAG" "$archive" --repo "${{ github.repository }}" --clobber

  debian-packages:
    name: build Debian package (${{ matrix.arch }})
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container: debian:12
    timeout-minutes: 30
    steps:
      - name: Install checkout, build, and upload dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential ca-certificates cmake curl gh git gzip \
            libcurl4-openssl-dev xz-utils

      - name: Check out tagged source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install pinned LDC
        uses: dlang-community/setup-dlang@2979e3ea011f6a234cd3a47dcbeb60f451c9635f
        with:
          compiler: ldc-1.43.0

      - name: Stamp release VERSION from tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          printf '%s\n' "$version" > VERSION
          echo "version=$version" >> "$GITHUB_ENV"

      - name: Build release binary and Debian package
        run: |
          dub build --compiler=ldc2 --build=release
          packaging/debian/build.sh "$PWD" "$PWD/scrubbed" /tmp/debian-package
          expected="/tmp/debian-package/scrubbed_${version}-1_${{ matrix.arch }}.deb"
          test -f "$expected"
          dpkg-deb --info "$expected"
          dpkg-deb --contents "$expected"

      - name: Upload Debian package to draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release upload "$TAG" /tmp/debian-package/*.deb --repo "${{ github.repository }}" --clobber

  installer:
    name: publish versioned installer
    needs: create-release
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out tagged source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Validate and stage installer
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          sh -n packaging/install.sh
          cp packaging/install.sh "scrubbed-install-${version}.sh"
          chmod 0755 "scrubbed-install-${version}.sh"
          echo "installer=scrubbed-install-${version}.sh" >> "$GITHUB_ENV"

      - name: Upload installer to draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release upload "$TAG" "$installer" --repo "${{ github.repository }}" --clobber

  checksums:
    name: publish checksums, build metadata, and attestations
    needs: [build, debian-packages, installer]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Download and verify the complete release asset set
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          mkdir -p /tmp/scrubbed-assets
          gh release download "$TAG" --repo "${{ github.repository }}" --dir /tmp/scrubbed-assets
          cd /tmp/scrubbed-assets
          version="${TAG#v}"
          expected=(
            "scrubbed-${version}-macos-arm64.tar.gz"
            "scrubbed-${version}-linux-x86_64.tar.gz"
            "scrubbed-${version}-linux-aarch64.tar.gz"
            "scrubbed_${version}-1_amd64.deb"
            "scrubbed_${version}-1_arm64.deb"
            "scrubbed-install-${version}.sh"
          )
          for asset in "${expected[@]}"; do test -f "$asset"; done
          actual_count=$(find . -maxdepth 1 -type f | wc -l)
          [[ "$actual_count" -eq "${#expected[@]}" ]] || {
            echo "expected ${#expected[@]} release assets before metadata, found $actual_count" >&2
            find . -maxdepth 1 -type f -print >&2
            exit 1
          }
          cat > BUILDINFO <<EOF
          tag=$TAG
          source_commit=$GITHUB_SHA
          workflow=${{ github.workflow_ref }}
          workflow_run=https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          compiler=ldc-1.43.0
          macos_runner=macos-15
          linux_archive_runners=ubuntu-24.04,ubuntu-24.04-arm
          debian_package_environment=debian:12
          EOF
          sha256sum "${expected[@]}" BUILDINFO > SHA256SUMS
          cat SHA256SUMS
          gh release upload "$TAG" BUILDINFO SHA256SUMS --repo "${{ github.repository }}" --clobber

      - name: Attest every published release file
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763
        with:
          subject-path: /tmp/scrubbed-assets/*

  publish:
    name: publish release
    needs: checksums
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Un-draft the release now every target has succeeded
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release edit "$TAG" --repo "${{ github.repository }}" --draft=false

  cleanup-failed-release:
    name: clean up stale draft release on failure
    # `create-release` only succeeds when `gh release create` found no
    # existing release for $TAG -- so a successful `create-release` means
    # *this* run is the one that created the draft, never an unrelated
    # pre-existing release for the same tag. `failure()` (scoped to this
    # job's direct `needs`) is true only when `build`, `checksums`, or
    # `publish` actually failed -- if `create-release` itself failed, the
    # rest are skipped (not failed), `failure()` is false, and this job
    # correctly never runs (issue #553).
    needs: [create-release, build, checksums, publish]
    if: failure() && needs.create-release.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Delete the draft release this run created
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # Belt-and-suspenders: only delete while it is still a draft, so
          # a race that somehow already published it for real is left
          # untouched rather than deleted.
          is_draft=$(gh release view "$TAG" --repo "${{ github.repository }}" \
            --json isDraft --jq .isDraft 2>/dev/null || echo "")
          if [[ "$is_draft" != "true" ]]; then
            echo "no stale draft release for $TAG to clean up (is_draft='$is_draft')"
            exit 0
          fi
          gh release delete "$TAG" --repo "${{ github.repository }}" --yes
          echo "deleted stale draft release for $TAG"
