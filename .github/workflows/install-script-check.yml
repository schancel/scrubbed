name: install script check

# Issue #579: packaging/install.sh (the curl | sh one-line installer from
# issue #502) is real, well-built work -- but nothing in CI ever actually
# ran it end to end. This workflow closes that gap.
#
# It builds a real release-shaped package for each target below (mirroring
# .github/workflows/release.yml's own build steps: dub build, then
# experiments/package_core/check.d create/verify, then tar), lays it out
# on a local HTTP server using the exact "latest/download/<asset>" and
# "download/v<version>/<asset>" path shapes GitHub's own release-asset
# URLs use, and points packaging/install.sh at that fixture via
# SCRUBBED_INSTALL_BASE_URL -- the override the script's own header
# comment documents as existing specifically so "a local fixture server
# can mimic this layout for offline testing".
#
# This is a real install-and-run proof, not a syntax check: it exercises
# the actual download, SHA-256 verification (both the accept path and,
# with a deliberately tampered manifest, the reject path), extraction,
# and install, then asserts the installed binary actually runs
# (`--version` succeeds and prints something).

on:
  push:
    branches:
      - main
    paths:
      - "packaging/**"
      - ".github/workflows/install-script-check.yml"
      - ".github/workflows/release.yml"
  pull_request:
    paths:
      - "packaging/**"
      - ".github/workflows/install-script-check.yml"
      - ".github/workflows/release.yml"
  workflow_dispatch:

jobs:
  install-check:
    name: install.sh end-to-end (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x86_64
            runner: ubuntu-24.04
            linux: true
          - target: macos-arm64
            runner: macos-15
            linux: false
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install pinned LDC
        uses: dlang-community/setup-dlang@2979e3ea011f6a234cd3a47dcbeb60f451c9635f
        with:
          compiler: ldc-1.43.0

      - name: Install Linux build dependencies (issue #353)
        if: matrix.linux
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake build-essential
          sudo apt-get install -y --no-install-recommends libcurl4-openssl-dev

      - name: Build release binary
        run: dub build --compiler=ldc2 --build=release

      - name: Stage binary at conventional install path for completions
        # Same reason as release.yml's identically-named step: `scrubbed
        # completion init` bakes its own resolved thisExePath() into the
        # printed script, so completions must be generated against the
        # conventional /usr/local/bin/scrubbed path.
        run: sudo install -m 0755 ./scrubbed /usr/local/bin/scrubbed

      - name: Build package checker
        run: ldc2 -O3 -release experiments/package_core/check.d -of=/tmp/scrubbed-check

      - name: Assemble and self-verify a fixture release package
        run: |
          set -eu
          rm -rf /tmp/scrubbed-package
          /tmp/scrubbed-check create "$PWD" "$PWD/scrubbed" /tmp/scrubbed-package /usr/local/bin/scrubbed
          version=$(cat VERSION)
          /tmp/scrubbed-check verify "$PWD" /tmp/scrubbed-package "$version"
          echo "version=$version" >> "$GITHUB_ENV"

      - name: Archive fixture package
        run: |
          set -eu
          archive="scrubbed-${version}-${{ matrix.target }}.tar.gz"
          tar -C /tmp/scrubbed-package -czf "/tmp/$archive" .
          echo "archive=$archive" >> "$GITHUB_ENV"
          ls -la "/tmp/$archive"

      - name: Lay out a local fixture release server
        # Mimics the two URL shapes install.sh's SCRUBBED_INSTALL_BASE_URL
        # override supports: "<base>/latest/download/<asset>" and
        # "<base>/download/v<version>/<asset>", each with its own
        # SHA256SUMS. Also lays out a second, deliberately tampered
        # manifest under a "bad-checksum" version, used below to prove
        # install.sh really rejects a checksum mismatch.
        run: |
          set -eu
          sha256() {
              if command -v sha256sum >/dev/null 2>&1; then
                  sha256sum "$1"
              else
                  shasum -a 256 "$1"
              fi
          }

          root=/tmp/scrubbed-fixture
          mkdir -p "$root/latest/download" "$root/download/v${version}" "$root/download/vbad-checksum"

          cp "/tmp/$archive" "$root/latest/download/$archive"
          cp "/tmp/$archive" "$root/download/v${version}/$archive"
          cp "/tmp/$archive" "$root/download/vbad-checksum/$archive"

          ( cd "$root/latest/download" && sha256 "$archive" > SHA256SUMS )
          ( cd "$root/download/v${version}" && sha256 "$archive" > SHA256SUMS )
          # Deliberately wrong hash, real filename -- install.sh must
          # refuse to install this.
          printf '%064d  %s\n' 0 "$archive" > "$root/download/vbad-checksum/SHA256SUMS"

          python3 -m http.server 8420 --directory "$root" --bind 127.0.0.1 >/tmp/fixture-server.log 2>&1 &
          echo $! > /tmp/fixture-server.pid

          up=""
          i=0
          while [ "$i" -lt 30 ]; do
              if curl -fsS "http://127.0.0.1:8420/latest/download/SHA256SUMS" >/dev/null 2>&1; then
                  up=1
                  break
              fi
              i=$((i + 1))
              sleep 0.5
          done
          [ -n "$up" ] || { echo "fixture HTTP server never came up" >&2; cat /tmp/fixture-server.log >&2; exit 1; }

      - name: install.sh against "latest" (default version resolution)
        run: |
          set -eu
          rm -rf /tmp/install-latest
          SCRUBBED_INSTALL_BASE_URL="http://127.0.0.1:8420" \
          SCRUBBED_INSTALL_PREFIX="/tmp/install-latest" \
          SCRUBBED_INSTALL_NO_SUDO=1 \
            sh packaging/install.sh
          out=$(/tmp/install-latest/bin/scrubbed --version)
          echo "latest install --version: $out"
          [ -n "$out" ] || { echo "installed binary printed nothing for --version" >&2; exit 1; }

      - name: install.sh against a pinned SCRUBBED_VERSION
        run: |
          set -eu
          rm -rf /tmp/install-pinned
          SCRUBBED_VERSION="$version" \
          SCRUBBED_INSTALL_BASE_URL="http://127.0.0.1:8420" \
          SCRUBBED_INSTALL_PREFIX="/tmp/install-pinned" \
          SCRUBBED_INSTALL_NO_SUDO=1 \
            sh packaging/install.sh
          out=$(/tmp/install-pinned/bin/scrubbed --version)
          echo "pinned install --version: $out"
          [ -n "$out" ] || { echo "installed binary printed nothing for --version" >&2; exit 1; }

      - name: install.sh must refuse a tampered checksum
        run: |
          set -eu
          rm -rf /tmp/install-bad
          if SCRUBBED_VERSION="bad-checksum" \
             SCRUBBED_INSTALL_BASE_URL="http://127.0.0.1:8420" \
             SCRUBBED_INSTALL_PREFIX="/tmp/install-bad" \
             SCRUBBED_INSTALL_NO_SUDO=1 \
               sh packaging/install.sh; then
              echo "install.sh accepted a corrupted checksum -- it must not" >&2
              exit 1
          fi
          if [ -e /tmp/install-bad/bin/scrubbed ]; then
              echo "install.sh installed a binary despite a checksum mismatch" >&2
              exit 1
          fi

      - name: Stop fixture server
        if: always()
        run: kill "$(cat /tmp/fixture-server.pid)" 2>/dev/null || true
